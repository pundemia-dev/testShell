[package]
name = "walltool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "walltool"
path = "src/main.rs"

[dependencies]
libc = "0.2"
image = "0.25"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
chrono = "0.4"
directories = "6"
walkdir = "2"
notify = "7"
infer = "0.19"
rusqlite = { version = "0.34", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rand = "0.9"

[dev-dependencies]
tempfile = "3.26.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.build-override]
opt-level = 3
codegen-units = 1
